<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#141533" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="Drift: a calm, touch-reactive fluid toy box." />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <title>Drift</title>
  </head>
  <body>
    <div id="app">
      <canvas id="gl"></canvas>
      <canvas id="overlay"></canvas>
      <div id="toy-ui" hidden></div>
      <div id="screens"></div>
      <div id="sheets"></div>
      <div id="fade"></div>
      <div id="unsupported" hidden>
        <p>This device can't show the fluid yet.<br />Try another browser or phone.</p>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
